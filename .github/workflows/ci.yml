name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './shared-core[test]'
      - run: python -m pip install --no-deps -e '.[test]'
      - run: pytest
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
