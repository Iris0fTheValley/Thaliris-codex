name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Optional branch, tag, or commit for a manual Core compatibility check. Leave empty to use the reviewed pin."
        required: false
        type: string
        default: ""
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
          ref: ${{ inputs.core_ref || '70128abd223ecdf789fd9e8ee3b1bafceec0dd70' }}
      - name: Selected Core identity
        run: 'git -C shared-core show -s --format="Core commit: %H%nSubject: %s" HEAD'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './shared-core[test]'
      - run: python -m pip install --no-deps -e '.[test]'
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - name: Runtime layout, identity and platform launchers
        run: python -m pytest tests/test_runtime_setup.py tests/test_runtime_identity.py tests/test_platform_launcher_parity.py tests/test_independent_host_maintenance.py --junitxml=results/platform.xml
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
      - name: Generated instruction consistency
        if: ${{ !cancelled() }}
        run: python -m pytest --ignore=tests/test_runtime_setup.py --ignore=tests/test_runtime_identity.py --ignore=tests/test_platform_launcher_parity.py --ignore=tests/test_independent_host_maintenance.py -k 'generated' --junitxml=results/generated.xml
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
      - name: Instruction concepts and exact historical ownership
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_prompt_contract.py -k 'not generated' --junitxml=results/instructions.xml
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
      - name: Behavioral regression
        if: ${{ !cancelled() }}
        run: python -m pytest --ignore=tests/test_runtime_setup.py --ignore=tests/test_runtime_identity.py --ignore=tests/test_platform_launcher_parity.py --ignore=tests/test_independent_host_maintenance.py --ignore=tests/test_prompt_contract.py -k 'not generated' --junitxml=results/behavior.xml
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: results/*.xml
