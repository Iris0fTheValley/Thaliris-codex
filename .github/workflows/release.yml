name: Release final artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source-validation:
    uses: ./.github/workflows/ci.yml
  build:
    needs: source-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: pairing
        shell: python
        run: |
          import json, os
          from pathlib import Path
          pin = json.loads(Path('release/core.lock.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + pin['commit'] + '\n')
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
          ref: ${{ steps.pairing.outputs.commit }}
      - run: python -m pip install build
      - name: Build final wheels exactly once
        run: |
          python -m build --wheel --outdir bundle shared-core
          python -m build --wheel --outdir bundle .
          python scripts/build-release-manifest.py --bundle bundle --core shared-core --tag "$GITHUB_REF_NAME"
      - uses: actions/attest@v4
        with:
          subject-path: 'bundle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: final-release-bundle
          path: bundle/*
          if-no-files-found: error
  gate:
    needs: build
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: final-release-bundle
          path: bundle
      - name: Verify attested repository, workflow, tag and source identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in bundle/*; do
            gh attestation verify "$asset" --repo Iris0fTheValley/Thaliris-codex --signer-workflow Iris0fTheValley/Thaliris-codex/.github/workflows/release.yml --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Install gate tools and exact built packages
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'pytest'], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', *map(str, Path('bundle').glob('*.whl'))], check=True)
      - name: Exact artifact fresh-install, reuse and integrity gates
        run: python -m pytest --import-mode=importlib tests/test_release_lifecycle.py tests/test_release_bundle.py
        env:
          THALIRIS_RELEASE_BUNDLE: ${{ github.workspace }}/bundle
  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-release-bundle
          path: bundle
      - name: Publish only the gated bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bundle/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
