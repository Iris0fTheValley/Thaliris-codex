[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thaliris-codex"
version = "0.4.3"
description = "Codex Host adapter for the shared Thaliris Core"
dependencies = ["thaliris>=0.4.3,<0.5"]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Thaliris contributors"}]
keywords = ["context", "lifecycle", "memory", "artifacts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/Iris0fTheValley/Thaliris-codex"
Issues = "https://github.com/Iris0fTheValley/Thaliris-codex/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
thaliris = "thaliris_codex.cli:main"
context = "thaliris_codex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["benchmarks/abcd/historical"]

[tool.hatch.build.targets.wheel]
packages = ["src/thaliris_codex"]

[tool.hatch.build.targets.sdist]
exclude = ["/HANDOFF.md"]
